        // ==========================================
        // MODULE 7: SPIN WHEEL & DEBATE TIMER
        // ==========================================
        function SpinWheelModule({ wheelTopics, wheelRoles }) {
            const [topicAngle, setTopicAngle] = useState(0);
            const [roleAngle, setRoleAngle] = useState(0);
            const [spinningTopic, setSpinningTopic] = useState(false);
            const [spinningRole, setSpinningRole] = useState(false);
            const [selectedTopicText, setSelectedTopicText] = useState('');
            const [selectedRoleText, setSelectedRoleText] = useState('');

            const [timerTotal, setTimerTotal] = useState(120);
            const [timerLeft, setTimerLeft] = useState(120);
            const [timerRunning, setTimerRunning] = useState(false);

            useEffect(() => {
                if (!timerRunning) return;
                if (timerLeft <= 0) {
                    setTimerRunning(false);
                    SoundFX.wrong();
                    return;
                }
                const id = setInterval(() => setTimerLeft(t => t - 1), 1000);
                return () => clearInterval(id);
            }, [timerRunning, timerLeft]);

            const setPresetTimer = (sec) => {
                setTimerRunning(false);
                setTimerTotal(sec);
                setTimerLeft(sec);
            };

            const spinWheel = (items, currentAngle, setAngle, setSpinning, setResult) => {
                if (!items || items.length === 0) return;
                setSpinning(true);
                const extraSpins = 5 + Math.random() * 4;
                const newAngle = currentAngle + extraSpins * 360;
                setAngle(newAngle);

                let ticks = 0;
                const tickInterval = setInterval(() => {
                    SoundFX.tick();
                    ticks++;
                    if (ticks > 18) clearInterval(tickInterval);
                }, 140);

                setTimeout(() => {
                    clearInterval(tickInterval);
                    setSpinning(false);
                    const slice = 360 / items.length;
                    const normalized = (360 - (newAngle % 360) + 270) % 360;
                    const idx = Math.floor(normalized / slice) % items.length;
                    setResult(items[idx]);
                    SoundFX.correct();
                }, 3100);
            };

            const spinBoth = () => {
                if (!spinningTopic) spinWheel(wheelTopics, topicAngle, setTopicAngle, setSpinningTopic, setSelectedTopicText);
                if (!spinningRole) spinWheel(wheelRoles, roleAngle, setRoleAngle, setSpinningRole, setSelectedRoleText);
            };

            const fmtTime = (s) => `${Math.floor(s / 60).toString().padStart(2, '0')}:${(s % 60).toString().padStart(2, '0')}`;

            return (
                <div className="max-w-6xl mx-auto space-y-6">
                    <div className="bg-white rounded-3xl p-5 border border-slate-200 shadow-md flex flex-wrap items-center justify-between gap-4">
                        <div>
                            <h2 className="font-heading text-xl font-extrabold text-slate-800">🎡 Мэтгэлцээн ба Дүрд Тоглох Санамсаргүй Хүрд</h2>
                            <p className="text-xs text-slate-500">Багуудад санамсаргүй сэдэв болон байр суурь оноож, цаг тоолуураар мэтгэлцүүлээрэй.</p>
                        </div>

                        <div className="flex flex-wrap items-center gap-2 bg-slate-50 p-2.5 rounded-2xl border border-slate-200">
                            <span className="text-xs font-bold text-slate-600 px-1">⏱️ Мэтгэлцээний цаг:</span>
                            {[60, 120, 180].map(sec => (
                                <button
                                    key={sec}
                                    onClick={() => setPresetTimer(sec)}
                                    className={`px-2.5 py-1 rounded-lg text-xs font-bold ${
                                        timerTotal === sec ? 'bg-indigo-600 text-white' : 'bg-white border border-slate-200 text-slate-700'
                                    }`}
                                >
                                    {sec / 60} мин
                                </button>
                            ))}
                            <div className={`px-3 py-1 rounded-xl font-mono text-base font-extrabold ${
                                timerLeft <= 10 && timerLeft > 0 ? 'bg-rose-100 text-rose-700 animate-pulse' : 'bg-slate-900 text-white'
                            }`}>
                                {fmtTime(timerLeft)}
                            </div>
                            <button
                                onClick={() => setTimerRunning(!timerRunning)}
                                className={`px-3 py-1.5 rounded-xl text-xs font-bold text-white ${
                                    timerRunning ? 'bg-amber-500 hover:bg-amber-600' : 'bg-emerald-600 hover:bg-emerald-700'
                                }`}
                            >
                                {timerRunning ? 'Зогсоох ⏸' : 'Эхлэх ▶'}
                            </button>
                            <button
                                onClick={() => setPresetTimer(timerTotal)}
                                className="px-2.5 py-1.5 rounded-xl text-xs font-bold bg-slate-200 text-slate-700"
                            >
                                ↺
                            </button>
                        </div>
                    </div>

                    <div className="text-center">
                        <button
                            onClick={spinBoth}
                            disabled={spinningTopic || spinningRole}
                            className="px-8 py-3.5 bg-gradient-to-r from-fuchsia-600 via-purple-600 to-indigo-600 hover:from-fuchsia-700 hover:to-indigo-700 text-white font-extrabold rounded-2xl shadow-lg shadow-purple-200 text-sm transition-all transform hover:-translate-y-0.5"
                        >
                            🎰 Сэдэв ба Дүрийг Хоёуланг нь Эргүүлэх!
                        </button>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <WheelCard
                            title="1. Мэтгэлцээний Сэдэв"
                            items={wheelTopics}
                            angle={topicAngle}
                            spinning={spinningTopic}
                            selectedText={selectedTopicText}
                            onSpin={() => spinWheel(wheelTopics, topicAngle, setTopicAngle, setSpinningTopic, setSelectedTopicText)}
                            palette={['#4f46e5', '#7c3aed', '#2563eb', '#db2777', '#059669', '#d97706']}
                        />
                        <WheelCard
                            title="2. Дүр ба Байр Суурь"
                            items={wheelRoles}
                            angle={roleAngle}
                            spinning={spinningRole}
                            selectedText={selectedRoleText}
                            onSpin={() => spinWheel(wheelRoles, roleAngle, setRoleAngle, setSpinningRole, setSelectedRoleText)}
                            palette={['#e11d48', '#0284c7', '#16a34a', '#9333ea', '#ea580c', '#0d9488']}
                        />
                    </div>
                </div>
            );
        }

        function WheelCard({ title, items, angle, spinning, selectedText, onSpin, palette }) {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas || items.length === 0) return;
                const ctx = canvas.getContext('2d');
                const size = canvas.width;
                const center = size / 2;
                const radius = center - 10;
                const slice = (2 * Math.PI) / items.length;

                ctx.clearRect(0, 0, size, size);

                items.forEach((label, i) => {
                    const start = i * slice;
                    const end = start + slice;
                    ctx.beginPath();
                    ctx.moveTo(center, center);
                    ctx.arc(center, center, radius, start, end);
                    ctx.closePath();
                    ctx.fillStyle = palette[i % palette.length];
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#ffffff';
                    ctx.stroke();

                    ctx.save();
                    ctx.translate(center, center);
                    ctx.rotate(start + slice / 2);
                    ctx.textAlign = 'right';
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 12px "Noto Sans", sans-serif';
                    const shortLabel = label.length > 24 ? label.slice(0, 22) + '…' : label;
                    ctx.fillText(shortLabel, radius - 16, 4);
                    ctx.restore();
                });

                ctx.beginPath();
                ctx.arc(center, center, 22, 0, 2 * Math.PI);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#1e293b';
                ctx.stroke();
            }, [items, palette]);

            return (
                <div className="bg-white rounded-3xl p-6 border border-slate-200 shadow-lg flex flex-col items-center">
                    <h3 className="font-heading text-lg font-extrabold text-slate-800 mb-4">{title}</h3>

                    <div className="relative flex items-center justify-center my-2">
                        <div className="absolute -top-3 z-10 w-0 h-0 border-l-[14px] border-l-transparent border-r-[14px] border-r-transparent border-t-[24px] border-t-amber-400 drop-shadow-md"></div>
                        <div
                            style={{
                                transform: `rotate(${angle}deg)`,
                                transition: spinning ? 'transform 3s cubic-bezier(0.15, 0.85, 0.2, 1)' : 'none'
                            }}
                        >
                            <canvas ref={canvasRef} width="300" height="300" className="max-w-full h-auto rounded-full shadow-inner" />
                        </div>
                    </div>

                    <button
                        onClick={onSpin}
                        disabled={spinning || items.length === 0}
                        className="mt-4 px-6 py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl text-xs transition-all"
                    >
                        {spinning ? 'Эргэж байна...' : 'Энэ хүрдийг эргүүлэх 🎯'}
                    </button>

                    {selectedText && (
                        <div className="mt-4 w-full bg-indigo-50 border border-indigo-200 rounded-2xl p-4 text-center animate-pop">
                            <div className="text-[11px] font-bold uppercase text-indigo-500 mb-1">Сонгогдсон үр дүн:</div>
                            <div className="text-sm font-extrabold text-slate-900">{selectedText}</div>
                        </div>
                    )}
                </div>
            );
        }

        // ==========================================
        // MODULE 8: TEAM JEOPARDY BOARD
        // ==========================================
        function JeopardyModule({ categories, teams, setTeams, showToast, askConfirm }) {
            const [usedTiles, setUsedTiles] = useState([]);
            const [activeModal, setActiveModal] = useState(null);
            const [showAnswer, setShowAnswer] = useState(false);
            const [qTimer, setQTimer] = useState(30);

            useEffect(() => {
                if (!activeModal || showAnswer || qTimer <= 0) return;
                const id = setInterval(() => setQTimer(t => t - 1), 1000);
                return () => clearInterval(id);
            }, [activeModal, showAnswer, qTimer]);

            const openTile = (cat, q) => {
                const key = `${cat.id}_${q.points}`;
                if (usedTiles.includes(key)) return;
                SoundFX.flip();
                setActiveModal({ catId: cat.id, catTitle: cat.title, ...q });
                setShowAnswer(false);
                setQTimer(30);
            };

            const awardTeamPoints = (teamId, delta) => {
                setTeams(prev => prev.map(t => t.id === teamId ? { ...t, jeopardyScore: t.jeopardyScore + delta } : t));
                if (delta > 0) SoundFX.correct();
                else SoundFX.wrong();
            };

            const completeTileForTeam = (teamId) => {
                if (!activeModal) return;
                const key = `${activeModal.catId}_${activeModal.points}`;
                setUsedTiles(prev => [...prev, key]);

                    awardTeamPoints(teamId, activeModal.points);

                                            className="font-bold text-xs bg-transparent border-b border-transparent focus:border-current outline-none w-full"
                                        />
                                    </div>
                                    <div className="flex items-center justify-between mt-1">
                                        <span className="text-2xl font-extrabold">{team.jeopardyScore}</span>
                                        <div className="flex gap-1">
                                            <button
                                                onClick={() => awardTeamPoints(team.id, 100)}
                                                className="px-2 py-1 bg-white/80 hover:bg-white rounded-lg text-xs font-extrabold shadow-sm"
                                            >
                                                +100
                                            </button>
                                            <button
                                                onClick={() => awardTeamPoints(team.id, -100)}
                                                className="px-2 py-1 bg-white/80 hover:bg-white rounded-lg text-xs font-extrabold shadow-sm"

                                                -100

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4">

                            <div key={cat.id} className="space-y-3">

            useEffect(() => {
                if (selectedPerk) {
                    setCurrentBid(selectedPerk.startPrice);
                    setHighestBidderId(null);
                }

            const adjustMoney = (teamId, amount) => {
                setTeams(prev => prev.map(t => t.id === teamId ? { ...t, money: Math.max(0, t.money + amount) } : t));
                if (amount > 0) SoundFX.bid();

            const addAccount = (e) => {

                const colors = [
                    { color: 'bg-indigo-600', lightBg: 'bg-indigo-50 border-indigo-200 text-indigo-800' },
                    { color: 'bg-purple-600', lightBg: 'bg-purple-50 border-purple-200 text-purple-800' },
                    { color: 'bg-teal-600', lightBg: 'bg-teal-50 border-teal-200 text-teal-800' }
                ];
                const pick = colors[teams.length % colors.length];
                setTeams(prev => [
                    ...prev,
                    { id: 'acc_' + Date.now(), name: newStudentName.trim(), ...pick, jeopardyScore: 0, money: 2000 }
                ]);
                setNewStudentName('');
                showToast('Шинэ данс нээгдлээ!');
            };

            const placeBid = (team, increment) => {
                const nextBid = highestBidderId === null ? Math.max(currentBid, selectedPerk.startPrice) : currentBid + increment;
                if (team.money < nextBid) {
                    SoundFX.wrong();
                    showToast(`${team.name}-ийн үлдэгдэл (${team.money}₮) хүрэлцэхгүй байна!`, 'error');
                    return;
                }
                SoundFX.bid();
                setCurrentBid(nextBid);
                setHighestBidderId(team.id);
            };

            const finalizeSold = () => {
                if (!highestBidderId || !selectedPerk) return;
                const winner = teams.find(t => t.id === highestBidderId);
                if (!winner) return;

                adjustMoney(winner.id, -currentBid);
                SoundFX.sold();
                if (window.confetti) window.confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });

                setHistory(prev => [
                    {
                        id: Date.now(),
                        perkTitle: selectedPerk.title,
                        winnerName: winner.name,
                        price: currentBid,
                        time: new Date().toLocaleTimeString('mn-MN', { hour: '2-digit', minute: '2-digit' })

                    try {
                        const imported = JSON.parse(ev.target.result);
                        if (!imported.topics || !imported.quizzes) {
                            showToast('Буруу бүтэцтэй JSON файл байна!', 'error');
                            return;
                        }
                        const { students: impStudents, ...restData } = imported;
                        setData(prev => ({ ...prev, ...restData }));
                        if (Array.isArray(impStudents) && impStudents.length > 0) {
                            setStudents(impStudents);
                        }
                        showToast('JSON файлаас бүх өгөгдөл амжилттай орлоо!');
                    } catch (err) {
                        showToast('JSON файл уншихад алдаа гарлаа!', 'error');
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            // Export Class Summary CSV (UTF-8 BOM for Excel Cyrillic)

                    const tQ = (st.quizHistory || []).reduce((a, b) => a + (b.total || 0), 0);
                    const tC = (st.quizHistory || []).reduce((a, b) => a + (b.score || 0), 0);
                    const avg = tQ > 0 ? Math.round((tC / tQ) * 100) : 0;
                    return [
                        idx + 1,
                        `"${st.name}"`,
                        `"${st.className}"`,
                        st.level,
                        st.xp,
                        (st.quizHistory || []).length,
                        `"${avg}%"`,
                        (st.masteredCards || []).length,
                        (st.unlockedBadges || []).length
                    ].join(',');

                const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\n');

                const a = document.createElement('a');

                                    if (editingFcId) {
                                        setData(prev => ({
                                            ...prev,
                                            factChecks: prev.factChecks.map(fc => fc.id === editingFcId ? { ...fc, ...payload } : fc)
                                        }));
                                        setEditingFcId(null);
                                        showToast('Баримт шалгагчийн мэдээлэл шинэчлэгдлээ!');
                                    } else {
                                        setData(prev => ({
                                            ...prev,
                                            factChecks: [...prev.factChecks, { id: 'fc_' + Date.now(), ...payload }]
                                        }));
                                        showToast('Баримт шалгагчийн мэдээлэл нэмэгдлээ!');
                                    }
                                    setFcForm({ topicId: data.topics[0]?.id || '', author: 'Мэдээллийн_Суваг', handle: '@medee_mn', claim: '', isTrue: false, explanation: '' });
                                }}
                                className="bg-slate-50 p-5 rounded-2xl border border-slate-200 space-y-3"
                            >
                                <div className="font-bold text-xs uppercase text-slate-700">
                                    {editingFcId ? '✏️ Баримт шалгагчийн мэдээлэл засах' : '➕ Шинэ баримт шалгагч нэмэх'}
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                    <select
                                        value={fcForm.topicId}
                                        onChange={(e) => setFcForm({ ...fcForm, topicId: e.target.value })}
                                        className="p-2.5 rounded-xl border border-slate-200 text-xs bg-white"
                                    >
                                        {data.topics.map(t => <option key={t.id} value={t.id}>{t.title}</option>)}
                                    </select>
                                    <input
                                        type="text"
                                        placeholder="Нийтлэгчийн нэр (жнь: Сошиал_Мэдээ)"
                                        value={fcForm.author}
                                        onChange={(e) => setFcForm({ ...fcForm, author: e.target.value })}
                                        className="p-2.5 rounded-xl border border-slate-200 text-xs bg-white"
                                    />
                                    <select
                                        value={fcForm.isTrue ? 'true' : 'false'}
                                        onChange={(e) => setFcForm({ ...fcForm, isTrue: e.target.value === 'true' })}
                                        className="p-2.5 rounded-xl border border-slate-200 text-xs bg-white font-bold"
                                    >
                                        <option value="false">❌ Энэ мэдээлэл: ХУДАЛ</option>
                                        <option value="true">✅ Энэ мэдээлэл: ҮНЭН</option>
                                    </select>
                                </div>
                                <textarea
                                    rows="2"
                                    required
                                    placeholder="Шалгах мэдэгдэл / Цуурхал..."
                                    value={fcForm.claim}
                                    onChange={(e) => setFcForm({ ...fcForm, claim: e.target.value })}
                                    className="w-full p-2.5 rounded-xl border border-slate-200 text-xs bg-white"
                                ></textarea>
                                <textarea
                                    rows="2"
                                    required
                                    placeholder="Хууль зүй ба Шинжлэх ухааны бодит тайлбар..."
                                    value={fcForm.explanation}
                                    onChange={(e) => setFcForm({ ...fcForm, explanation: e.target.value })}
                                    className="w-full p-2.5 rounded-xl border border-slate-200 text-xs bg-white"
                                ></textarea>
                                <div className="flex gap-2">
                                    <button type="submit" className="flex-1 py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl text-xs">
                                        {editingFcId ? 'Өөрчлөлтийг хадгалах ✓' : '+ Баримт шалгагч нэмэх'}
                                    </button>
                                    {editingFcId && (
                                        <button
                                            type="button"
                                            onClick={() => {
                                                setEditingFcId(null);
                                                setFcForm({ topicId: data.topics[0]?.id || '', author: 'Мэдээллийн_Суваг', handle: '@medee_mn', claim: '', isTrue: false, explanation: '' });
                                            }}
                                            className="px-4 py-2.5 bg-slate-200 text-slate-700 font-bold rounded-xl text-xs"
                                        >
                                            Болих
                                        </button>
                                    )}
                                </div>
                            </form>

                            <div className="space-y-2.5">
                                {data.factChecks.map(fc => (
                                    <div key={fc.id} className="p-4 border border-slate-200 rounded-2xl flex items-start justify-between gap-3">
                                        <div>
                                            <span className={`text-[10px] font-extrabold px-2 py-0.5 rounded ${fc.isTrue ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>
                                                {fc.isTrue ? 'ҮНЭН' : 'ХУДАЛ'}
                                            </span>
                                            <div className="font-bold text-xs sm:text-sm text-slate-800 mt-1">{fc.claim}</div>
                                        </div>
                                        <div className="flex gap-1.5 shrink-0">
                                            <button
                                                onClick={() => {
                                                    setEditingFcId(fc.id);
                                                    setFcForm({
                                                        topicId: fc.topicId,
                                                        author: fc.author,
                                                        handle: fc.handle,
                                                        claim: fc.claim,
                                                        isTrue: fc.isTrue,
                                                        explanation: fc.explanation
                                                    });
                                                }}
                                                className="text-blue-700 bg-blue-50 hover:bg-blue-100 px-2.5 py-1 rounded-lg text-xs font-bold"
                                            >
                                                Засах ✏️
                                            </button>
                                            <button
                                                onClick={() => setData(prev => ({ ...prev, factChecks: prev.factChecks.filter(x => x.id !== fc.id) }))}
                                                className="text-rose-600 bg-rose-50 hover:bg-rose-100 px-2.5 py-1 rounded-lg text-xs font-bold"
                                            >
                                                Устгах 🗑️
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* TAB 6: JEOPARDY QUESTIONS CRUD */}
                    {tab === 'jeopardy' && (
                        <div className="space-y-5">
                            <form
                                onSubmit={(e) => {
                                    e.preventDefault();
                                    if (!jeopardyForm.question.trim()) return;
                                    setData(prev => ({
                                        ...prev,
                                        jeopardyCategories: prev.jeopardyCategories.map(cat => {
                                            if (cat.id !== jeopardyForm.catId) return cat;
                                            const exists = cat.questions.some(q => q.points === Number(jeopardyForm.points));
                                            const updatedQs = exists
                                                ? cat.questions.map(q =>
                                                    q.points === Number(jeopardyForm.points)
                                                        ? { points: q.points, question: jeopardyForm.question, answer: jeopardyForm.answer }
                                                        : q
                                                )
                                                : [...cat.questions, { points: Number(jeopardyForm.points), question: jeopardyForm.question, answer: jeopardyForm.answer }].sort((a, b) => a.points - b.points);
                                            return { ...cat, questions: updatedQs };
                                        })
                                    }));
                                    setJeopardyForm({ ...jeopardyForm, question: '', answer: '' });
                                    showToast('Jeopardy самбарын асуулт хадгалагдлаа!');
                                }}
                                className="bg-slate-50 p-5 rounded-2xl border border-slate-200 space-y-3"
                            >
                                <h3 className="font-bold text-xs uppercase text-slate-700">Jeopardy самбарын нүдний асуулт нэмэх / засах</h3>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <select
                                        value={jeopardyForm.catId}
                                        onChange={(e) => setJeopardyForm({ ...jeopardyForm, catId: e.target.value })}
                                        className="p-2.5 rounded-xl border border-slate-200 text-xs bg-white"
                                    >
                                        {data.jeopardyCategories.map(c => <option key={c.id} value={c.id}>{c.title}</option>)}
                                    </select>
                                    <select
                                        value={jeopardyForm.points}
                                        onChange={(e) => setJeopardyForm({ ...jeopardyForm, points: Number(e.target.value) })}
                                        className="p-2.5 rounded-xl border border-slate-200 text-xs bg-white font-bold"
                                    >
                                        <option value={100}>100 онооны нүд</option>
                                        <option value={200}>200 онооны нүд</option>
                                        <option value={300}>300 онооны нүд</option>
                                        <option value={400}>400 онооны нүд</option>
                                    </select>
                                </div>
                                <input
                                    type="text"
                                    required
                                    placeholder="Асуулт..."
                                    value={jeopardyForm.question}
                                    onChange={(e) => setJeopardyForm({ ...jeopardyForm, question: e.target.value })}
                                    className="w-full p-2.5 rounded-xl border border-slate-200 text-xs bg-white"
                                />
                                <input
                                    type="text"
                                    required
                                    placeholder="Зөв хариулт..."
                                    value={jeopardyForm.answer}
                                    onChange={(e) => setJeopardyForm({ ...jeopardyForm, answer: e.target.value })}
                                    className="w-full p-2.5 rounded-xl border border-slate-200 text-xs bg-white"
                                />
                                <button type="submit" className="w-full py-2.5 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl text-xs">
                                    ✓ Тухайн нүдний асуултыг хадгалах
                                </button>
                            </form>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {data.jeopardyCategories.map(cat => (
                                    <div key={cat.id} className="p-4 border border-slate-200 rounded-2xl space-y-2">
                                        <input
                                            type="text"
                                            value={cat.title}
                                            onChange={(e) => setData(prev => ({
                                                ...prev,
                                                jeopardyCategories: prev.jeopardyCategories.map(c => c.id === cat.id ? { ...c, title: e.target.value } : c)
                                            }))}
                                            className="font-extrabold text-sm text-slate-800 border-b border-slate-200 pb-1 w-full outline-none focus:border-indigo-500"
                                        />
                                        {cat.questions.map(q => (
                                            <div key={q.points} className="text-xs bg-slate-50 p-2.5 rounded-xl flex items-start justify-between gap-2">
                                                <div>
                                                    <strong className="text-indigo-600">{q.points} оноо:</strong> {q.question}
                                                </div>
                                                <button
                                                    onClick={() => setJeopardyForm({
                                                        catId: cat.id,
                                                        points: q.points,
                                                        question: q.question,
                                                        answer: q.answer
                                                    })}
                                                    className="text-blue-700 font-bold shrink-0"
                                                >
                                                    Засах ✏️
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* TAB 7: WHEEL TOPICS & ROLES CRUD */}
                    {tab === 'wheel' && (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="space-y-3">
                                <h3 className="font-bold text-sm text-slate-800">🎡 Хүрдний мэтгэлцээний сэдвүүд</h3>
                                <form
                                    onSubmit={(e) => {
                                        e.preventDefault();
                                        if (!wheelTopicInput.trim()) return;
                                        if (editingWheelTopicIdx !== null) {
                                            setData(prev => ({
                                                ...prev,
                                                wheelTopics: prev.wheelTopics.map((wt, idx) => idx === editingWheelTopicIdx ? wheelTopicInput.trim() : wt)
                                            }));
                                            setEditingWheelTopicIdx(null);
                                            showToast('Хүрдний сэдэв шинэчлэгдлээ!');
                                        } else {
                                            setData(prev => ({ ...prev, wheelTopics: [...prev.wheelTopics, wheelTopicInput.trim()] }));
                                            showToast('Хүрдэнд сэдэв нэмэгдлээ!');
                                        }
                                        setWheelTopicInput('');
                                    }}
                                    className="flex gap-2"
                                >
                                    <input
                                        type="text"
                                        required
                                        placeholder="Мэтгэлцээний сэдэв..."
                                        value={wheelTopicInput}
                                        onChange={(e) => setWheelTopicInput(e.target.value)}
                                        className="flex-1 p-2.5 rounded-xl border border-slate-200 text-xs"
                                    />
                                    <button type="submit" className="px-4 py-2 bg-indigo-600 text-white font-bold rounded-xl text-xs">
                                        {editingWheelTopicIdx !== null ? 'Хадгалах ✓' : '+ Нэмэх'}
                                    </button>
                                </form>
                                <div className="space-y-1.5">
                                    {data.wheelTopics.map((wt, i) => (
                                        <div key={i} className="p-2.5 bg-slate-50 border border-slate-200 rounded-xl flex justify-between items-center gap-2 text-xs">
                                            <span>{wt}</span>
                                            <div className="flex gap-1.5 shrink-0">
                                                <button
                                                    onClick={() => {
                                                        setEditingWheelTopicIdx(i);
                                                        setWheelTopicInput(wt);
                                                    }}
                                                    className="text-blue-700 font-bold"
                                                >
                                                    ✏️
                                                </button>
                                                <button
                                                    onClick={() => setData(prev => ({ ...prev, wheelTopics: prev.wheelTopics.filter((_, idx) => idx !== i) }))}
                                                    className="text-rose-600 font-bold"
                                                >
                                                    ✕
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="space-y-3">
                                <h3 className="font-bold text-sm text-slate-800">🎭 Хүрдний дүр ба байр суурь</h3>
                                <form
                                    onSubmit={(e) => {
                                        e.preventDefault();
                                        if (!wheelRoleInput.trim()) return;
                                        if (editingWheelRoleIdx !== null) {
                                            setData(prev => ({
                                                ...prev,
                                                wheelRoles: prev.wheelRoles.map((wr, idx) => idx === editingWheelRoleIdx ? wheelRoleInput.trim() : wr)
                                            }));
                                            setEditingWheelRoleIdx(null);
                                            showToast('Хүрдний дүр шинэчлэгдлээ!');
                                        } else {
                                            setData(prev => ({ ...prev, wheelRoles: [...prev.wheelRoles, wheelRoleInput.trim()] }));
                                            showToast('Хүрдэнд дүр нэмэгдлээ!');
                                        }
                                        setWheelRoleInput('');
                                    }}
                                    className="flex gap-2"
                                >
                                    <input
                                        type="text"
                                        required
                                        placeholder="Дүр эсвэл байр суурь..."
                                        value={wheelRoleInput}
                                        onChange={(e) => setWheelRoleInput(e.target.value)}
                                        className="flex-1 p-2.5 rounded-xl border border-slate-200 text-xs"
                                    />
                                    <button type="submit" className="px-4 py-2 bg-purple-600 text-white font-bold rounded-xl text-xs">
                                        {editingWheelRoleIdx !== null ? 'Хадгалах ✓' : '+ Нэмэх'}
                                    </button>
                                </form>
                                <div className="space-y-1.5">
                                    {data.wheelRoles.map((wr, i) => (
                                        <div key={i} className="p-2.5 bg-slate-50 border border-slate-200 rounded-xl flex justify-between items-center gap-2 text-xs">
                                            <span>{wr}</span>
                                            <div className="flex gap-1.5 shrink-0">
                                                <button
                                                    onClick={() => {
                                                        setEditingWheelRoleIdx(i);
                                                        setWheelRoleInput(wr);
                                                    }}
                                                    className="text-blue-700 font-bold"
                                                >
                                                    ✏️
                                                </button>
                                                <button
                                                    onClick={() => setData(prev => ({ ...prev, wheelRoles: prev.wheelRoles.filter((_, idx) => idx !== i) }))}
                                                    className="text-rose-600 font-bold"
                                                >
                                                    ✕
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* TAB 8: AUCTION PERKS CRUD */}
                    {tab === 'auction' && (
                        <div className="space-y-5">
                            <form
                                onSubmit={(e) => {
                                    e.preventDefault();
                                    if (!perkForm.title.trim()) return;
                                    const payload = { ...perkForm, startPrice: Number(perkForm.startPrice) || 500 };
                                    if (editingPerkId) {
                                        setData(prev => ({
                                            ...prev,
                                            auctionPerks: prev.auctionPerks.map(ap => ap.id === editingPerkId ? { ...ap, ...payload } : ap)
                                        }));
                                        setEditingPerkId(null);
                                        showToast('Дуудлага худалдааны эрх шинэчлэгдлээ!');
                                    } else {
                                        setData(prev => ({
                                            ...prev,
                                            auctionPerks: [...prev.auctionPerks, { id: 'ap_' + Date.now(), ...payload }]
                                        }));
                                        showToast('Дуудлага худалдааны эрх нэмэгдлээ!');
                                    }
                                    setPerkForm({ icon: '🎟️', title: '', desc: '', startPrice: 500 });
                                }}
                                className="bg-slate-50 p-5 rounded-2xl border border-slate-200 space-y-3"
                            >
                                <div className="font-bold text-xs uppercase text-slate-700">
                                    {editingPerkId ? '✏️ Дуудлага худалдааны эрх засах' : '➕ Дуудлага худалдааны шинэ эрх нэмэх'}
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-4 gap-3">
                                    <input
                                        type="text"
                                        placeholder="Эможи (жнь: 🎟️)"
                                        value={perkForm.icon}
                                        onChange={(e) => setPerkForm({ ...perkForm, icon: e.target.value })}
                                        className="p-2.5 rounded-xl border border-slate-200 text-xs bg-white text-center"
                                    />
                                    <input
                                        type="text"
                                        required
                                        placeholder="Эрхийн нэр..."
                                        value={perkForm.title}
                                        onChange={(e) => setPerkForm({ ...perkForm, title: e.target.value })}
                                        className="sm:col-span-2 p-2.5 rounded-xl border border-slate-200 text-xs bg-white"
                                    />
                                    <input
                                        type="number"
                                        required
                                        min="100"
                                        step="100"
                                        placeholder="Эхлэх үнэ (₮)"
                                        value={perkForm.startPrice}
                                        onChange={(e) => setPerkForm({ ...perkForm, startPrice: Number(e.target.value) })}
                                        className="p-2.5 rounded-xl border border-slate-200 text-xs bg-white font-bold"
                                    />
                                </div>
                                <input
                                    type="text"
                                    placeholder="Тайлбар..."
                                    value={perkForm.desc}
                                    onChange={(e) => setPerkForm({ ...perkForm, desc: e.target.value })}
                                    className="w-full p-2.5 rounded-xl border border-slate-200 text-xs bg-white"
                                />
                                <div className="flex gap-2">
                                    <button type="submit" className="flex-1 py-2.5 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl text-xs">
                                        {editingPerkId ? 'Өөрчлөлтийг хадгалах ✓' : '+ Эрх нэмэх'}
                                    </button>
                                    {editingPerkId && (
                                        <button
                                            type="button"
                                            onClick={() => {
                                                setEditingPerkId(null);
                                                setPerkForm({ icon: '🎟️', title: '', desc: '', startPrice: 500 });
                                            }}
                                            className="px-4 py-2.5 bg-slate-200 text-slate-700 font-bold rounded-xl text-xs"
                                        >
                                            Болих
                                        </button>
                                    )}
                                </div>
                            </form>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                {data.auctionPerks.map(ap => (
                                    <div key={ap.id} className="p-4 border border-slate-200 rounded-2xl flex items-start justify-between gap-2">
                                        <div className="flex items-start gap-3">
                                            <span className="text-2xl">{ap.icon}</span>
                                            <div>
                                                <div className="font-bold text-sm text-slate-800">{ap.title}</div>
                                                <div className="text-xs text-amber-700 font-extrabold mt-0.5">Эхлэх үнэ: {ap.startPrice} ₮</div>
                                                <p className="text-xs text-slate-500 mt-1">{ap.desc}</p>
                                            </div>
                                        </div>
                                        <div className="flex gap-1 shrink-0">
                                            <button
                                                onClick={() => {
                                                    setEditingPerkId(ap.id);
                                                    setPerkForm({ icon: ap.icon, title: ap.title, desc: ap.desc || '', startPrice: ap.startPrice });
                                                }}
                                                className="text-blue-700 bg-blue-50 hover:bg-blue-100 px-2 py-1 rounded text-xs font-bold"
                                            >
                                                ✏️
                                            </button>
                                            <button
                                                onClick={() => setData(prev => ({ ...prev, auctionPerks: prev.auctionPerks.filter(x => x.id !== ap.id) }))}
                                                className="text-rose-600 bg-rose-50 hover:bg-rose-100 px-2 py-1 rounded text-xs font-bold"
                                            >
                                                ✕
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
