                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                    gain.gain.setValueAtTime(0.18, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.35);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.35);
                });
            }

                if (this.muted) return;

                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.32);
            }

                if (this.muted) return;

                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.08);

            static tick() {

                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.03);
            }

            static bid() {

                if (!this.ctx) return;
                const now = this.ctx.currentTime;

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            }

            static sold() {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const thud = this.ctx.createOscillator();
                const thudGain = this.ctx.createGain();
                thud.type = 'triangle';
                thud.frequency.setValueAtTime(140, now);
                thud.frequency.exponentialRampToValueAtTime(45, now + 0.18);
                thudGain.gain.setValueAtTime(0.35, now);
                thudGain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
                thud.connect(thudGain);
                thudGain.connect(this.ctx.destination);
                thud.start(now);
                thud.stop(now + 0.18);

                [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const g = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + 0.15 + i * 0.09);
                    g.gain.setValueAtTime(0.18, now + 0.15 + i * 0.09);
                    g.gain.exponentialRampToValueAtTime(0.001, now + 0.15 + i * 0.09 + 0.4);
                    osc.connect(g);
                    g.connect(this.ctx.destination);
                    osc.start(now + 0.15 + i * 0.09);
                    osc.stop(now + 0.15 + i * 0.09 + 0.4);
                });
            }

            const [showQuickStudentModal, setShowQuickStudentModal] = useState(false);
            const [quickName, setQuickName] = useState('');
            const [quickClass, setQuickClass] = useState('11А');

            // Classroom Teams State
            const [teams, setTeams] = useState(() => {
                try {
                    const saved = localStorage.getItem('niigmiin_ukhaan_teams_v2');
                    if (saved) return JSON.parse(saved);
                } catch (e) { console.error(e); }
                return [
                    { id: "team1", name: "1-р баг (Хөх)", color: "bg-blue-600", lightBg: "bg-blue-50 border-blue-200 text-blue-800", jeopardyScore: 0, money: 2500 },
                    { id: "team2", name: "2-р баг (Улаан)", color: "bg-rose-600", lightBg: "bg-rose-50 border-rose-200 text-rose-800", jeopardyScore: 0, money: 2500 },
                    { id: "team3", name: "3-р баг (Ногоон)", color: "bg-emerald-600", lightBg: "bg-emerald-50 border-emerald-200 text-emerald-800", jeopardyScore: 0, money: 2500 },
                    { id: "team4", name: "4-р баг (Шар)", color: "bg-amber-500", lightBg: "bg-amber-50 border-amber-200 text-amber-800", jeopardyScore: 0, money: 2500 }
                ];
            });

            const [auctionHistory, setAuctionHistory] = useState([]);

            // Top Mode & Active Module
            const [mainMode, setMainMode] = useState('student'); // 'student' | 'teacher'
            const [activeModule, setActiveModule] = useState('quiz');
            const [selectedTopic, setSelectedTopic] = useState('all');
            const [isMuted, setIsMuted] = useState(false);

            // Admin Auth State
            const [isAdminUnlocked, setIsAdminUnlocked] = useState(() => localStorage.getItem('niigmiin_admin_unlocked_v2') === 'true');
            const [pinInput, setPinInput] = useState('');
            const [rememberAdmin, setRememberAdmin] = useState(true);
            const [pinError, setPinError] = useState('');

            // Custom Toast & Confirm Modal
            const [toast, setToast] = useState(null);
            const [confirmDialog, setConfirmDialog] = useState(null);

            const showToast = (message, type = 'success') => {
                setToast({ message, type, id: Date.now() });
                setTimeout(() => {
                    setToast(prev => (prev && Date.now() - prev.id >= 2900 ? null : prev));
                }, 3000);
            };

            const askConfirm = (title, message, onConfirm) => {
                setConfirmDialog({ title, message, onConfirm });
            };

            // ==========================================
            // FIREBASE REAL-TIME SYNC (READ & WRITE)
            // ==========================================
            useEffect(() => {
                if (!appDocRef) return;

                const unsubscribe = appDocRef.onSnapshot((doc) => {
                    setSyncStatus('connected');
                    if (doc.exists) {
                        const remote = doc.data();
                        isRemoteUpdate.current = true;
                        if (remote.curriculum) {
                            setData({ ...DEFAULT_DATA, ...remote.curriculum });
                        }
                        if (Array.isArray(remote.students) && remote.students.length > 0) {
                            setStudents(remote.students);
                        }
                        if (Array.isArray(remote.teams)) {
                            setTeams(remote.teams);
                        }
                        if (Array.isArray(remote.auctionHistory)) {
                            setAuctionHistory(remote.auctionHistory);
                        }
                    } else {
                        appDocRef.set({
                            curriculum: data,
                            students: students,
                            teams: teams,
                            auctionHistory: auctionHistory,
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                        }).catch(err => console.error("Анхны өгөгдөл бичих алдаа:", err));
                    }
                }, (error) => {
                    console.error("Firebase холболтын алдаа:", error);
                    setSyncStatus('error');
                });

                return () => unsubscribe();
            }, []);

            // LocalStorage болон Firebase руу өөрчлөлтүүдийг хадгалах
            useEffect(() => {
                localStorage.setItem('niigmiin_ukhaan_360_v2', JSON.stringify(data));
                localStorage.setItem('niigmiin_ukhaan_students_v2', JSON.stringify(students));
                localStorage.setItem('niigmiin_ukhaan_teams_v2', JSON.stringify(teams));

                if (!appDocRef) return;

                if (isInitialMount.current) {
                    isInitialMount.current = false;
                    return;
                }

                if (isRemoteUpdate.current) {
                    isRemoteUpdate.current = false;
                    return;
                }

                const timer = setTimeout(() => {
                    appDocRef.set({
                        curriculum: data,
                        students: students,
                        teams: teams,
                        auctionHistory: auctionHistory,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true }).catch(err => {
                        console.error("Firebase хадгалах алдаа:", err);
                        setSyncStatus('error');
                    });
                }, 400);

                return () => clearTimeout(timer);
            }, [data, students, teams, auctionHistory]);

            useEffect(() => {
                localStorage.setItem('niigmiin_ukhaan_active_st_v2', activeStudentId);
            }, [activeStudentId]);

            const activeStudent = useMemo(() => {
                return students.find(s => s.id === activeStudentId) || students[0];
            }, [students, activeStudentId]);

            const updateActiveStudent = (updaterFn) => {
                setStudents(prev => prev.map(st => {
                    if (st.id !== activeStudent.id) return st;
                    const updated = updaterFn(st);
                    const newLevel = Math.floor((updated.xp || 0) / 250) + 1;
                    return { ...updated, level: newLevel };
                }));
            };

            const toggleMute = () => {
                SoundFX.muted = !isMuted;
                setIsMuted(!isMuted);
            };

            const awardXP = (amount, badgeId = null) => {
                updateActiveStudent(prev => {
                    const newXP = prev.xp + amount;
                    const newLevel = Math.floor(newXP / 250) + 1;
                    const badges = [...(prev.unlockedBadges || [])];
                    if (badgeId && !badges.includes(badgeId)) badges.push(badgeId);
                    if (newXP >= 500 && !badges.includes('b5')) badges.push('b5');

                    if (newLevel > prev.level && window.confetti) {
                        window.confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
                    }
                    return { ...prev, xp: newXP, level: newLevel, unlockedBadges: badges };
                });
            };

            const handleQuickRegister = (e) => {
                e.preventDefault();
                if (!quickName.trim()) return;
                const created = {
                    id: 'st_' + Date.now(),
                    name: quickName.trim(),
                    className: quickClass.trim() || '11А',
                    xp: 20,
                    level: 1,
                    masteredCards: [],
                    unlockedBadges: ['b1'],
                    bestMatchTime: null,
                    quizHistory: [],
                    completedSims: [],
                    creativeNotes: []
                };
                setStudents(prev => [...prev, created]);
                setActiveStudentId(created.id);
                setQuickName('');
                setShowQuickStudentModal(false);
                SoundFX.correct();
                showToast(`Тавтай морил, ${created.name}! (+20 XP)`);
            };

            const MODULES = [
                { id: 'quiz', label: '1. Сэргэлэн сорил', icon: '🎯', color: 'from-indigo-500 to-blue-600' },
                { id: 'flashcards', label: '2. Мэдлэгийн карт', icon: '🃏', color: 'from-purple-500 to-indigo-600' },
                { id: 'simulation', label: '3. Хэрэв чи... байсан бол?', icon: '🧭', color: 'from-emerald-500 to-teal-600' },
                { id: 'factcheck', label: '4. Баримт шалгагч', icon: '🔍', color: 'from-rose-500 to-pink-600' },
                { id: 'matching', label: '5. Ойлголт эвлүүлэх', icon: '🧩', color: 'from-amber-500 to-orange-600' },
                { id: 'creative', label: '6. Бүтээлч лаборатори', icon: '💡', color: 'from-cyan-500 to-blue-600' },
                { id: 'wheel', label: '7. Санамсаргүй хүрд', icon: '🎡', color: 'from-fuchsia-500 to-purple-600' },
                { id: 'jeopardy', label: '8. Алтан хонх / Jeopardy', icon: '🏆', color: 'from-yellow-500 to-amber-600' },
                { id: 'auction', label: '9. Ангийн банк & Дуудлага', icon: '💰', color: 'from-teal-500 to-emerald-600' },
                { id: 'report', label: '10. Миний Тайлан / Дүн', icon: '📜', color: 'from-slate-700 to-slate-900' }
            ];

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (pinInput === (data.adminPin || "1234")) {
                    setIsAdminUnlocked(true);
                    setPinError('');
                    setPinInput('');
                    if (rememberAdmin) {
                        localStorage.setItem('niigmiin_admin_unlocked_v2', 'true');
                    }
                    showToast('Багшийн админ хэсэгт амжилттай нэвтэрлээ!');
                } else {
                    SoundFX.wrong();
                    setPinError('Нууц код буруу байна! (Анхны PIN: 1234)');
                }
            };

            const handleAdminLock = () => {
                setIsAdminUnlocked(false);
                localStorage.removeItem('niigmiin_admin_unlocked_v2');
                showToast('Админ хэсэг цоожлогдлоо.', 'info');
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* TOAST NOTIFICATION */}
                    {toast && (
                        <div className="fixed bottom-5 right-5 z-50 animate-pop no-print">
                            <div className={`px-5 py-3.5 rounded-2xl shadow-xl border font-semibold text-sm flex items-center gap-3 ${
                                toast.type === 'error'
                                    ? 'bg-rose-600 text-white border-rose-500'
                                    : toast.type === 'info'
                                    ? 'bg-slate-800 text-white border-slate-700'
                                    : 'bg-emerald-600 text-white border-emerald-500'
                            }`}>
                                <span>{toast.type === 'error' ? '⚠️' : toast.type === 'info' ? 'ℹ️' : '✅'}</span>
                                <span>{toast.message}</span>
                            </div>
                        </div>
                    )}

                    {/* CUSTOM CONFIRMATION MODAL */}
                    {confirmDialog && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 no-print">
                            <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100 animate-pop">
                                <h3 className="font-heading text-lg font-bold text-slate-900 mb-2">{confirmDialog.title}</h3>
                                <p className="text-sm text-slate-600 mb-6 leading-relaxed">{confirmDialog.message}</p>
                                <div className="flex justify-end gap-3">
                                    <button
                                        onClick={() => setConfirmDialog(null)}
                                        className="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-600 font-semibold text-sm hover:bg-slate-50"
                                    >
                                        Болих
                                    </button>
                                    <button
                                        onClick={() => {
                                            confirmDialog.onConfirm();
                                            setConfirmDialog(null);
                                        }}
                                        className="px-5 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-sm shadow-md"
                                    >
                                        Тийм, баталгаажуулах
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* QUICK STUDENT LOGIN / REGISTRATION MODAL */}
                    {showQuickStudentModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 no-print">
                            <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100 animate-pop">
                                <div className="flex items-center justify-between mb-4">
                                    <h3 className="font-heading text-lg font-extrabold text-slate-900">🎓 Сурагч нэвтрэх / Шинээр бүртгүүлэх</h3>
                                    <button onClick={() => setShowQuickStudentModal(false)} className="text-slate-400 hover:text-slate-700 text-2xl font-bold">×</button>
                                </div>
                                <form onSubmit={handleQuickRegister} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1">Сурагчийн овог, нэр</label>
                                        <input
                                            type="text"
                                            required
                                            placeholder="Жишээ: А. Номин-Эрдэнэ"
                                            value={quickName}
                                            onChange={(e) => setQuickName(e.target.value)}
                                            className="w-full p-3 rounded-xl border border-slate-200 text-sm outline-none focus:ring-2 focus:ring-indigo-500"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1">Анги, бүлэг</label>
                                        <input
                                            type="text"
                                            required
                                            placeholder="Жишээ: 11А"
                                            value={quickClass}
                                            onChange={(e) => setQuickClass(e.target.value)}
                                            className="w-full p-3 rounded-xl border border-slate-200 text-sm outline-none focus:ring-2 focus:ring-indigo-500"
                                        />
                                    </div>
                                    <div className="flex justify-end gap-2 pt-2">
                                        <button
                                            type="button"
                                            onClick={() => setShowQuickStudentModal(false)}
                                            className="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-600 text-xs font-bold"
                                        >
                                            Болих
                                        </button>
                                        <button
                                            type="submit"
                                            className="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-md"
                                        >
                                            Бүртгүүлээд нэвтрэх ✓
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* TOP NAVIGATION BAR */}
                    <header className="bg-white/95 backdrop-blur-md border-b border-indigo-100 sticky top-0 z-40 shadow-sm no-print">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
                            {/* Brand */}
                            <div
                                onClick={() => setMainMode('student')}
                                className="flex items-center gap-3 cursor-pointer group"
                            >
                                <div className="w-11 h-11 rounded-2xl bg-gradient-to-br from-indigo-600 via-purple-600 to-blue-600 flex items-center justify-center text-white text-2xl shadow-md shadow-indigo-200 group-hover:scale-105 transition-transform">
                                    🎓
                                </div>
                                <div>
                                    <div className="flex items-center gap-2">
                                        <h1 className="font-heading text-lg sm:text-xl font-extrabold bg-gradient-to-r from-indigo-700 to-purple-600 bg-clip-text text-transparent">
                                            Нийгмийн Ухаан 360°
                                        </h1>
                                        <span
                                            title={
                                                syncStatus === 'connected'
                                                    ? 'Firebase өгөгдлийн сантай шууд холбогдсон'
                                                    : syncStatus === 'connecting'
                                                    ? 'Firebase-тай холбогдож байна...'
                                                    : syncStatus === 'error'
                                                    ? 'Firebase холболтын алдаа (Дүрэм эсвэл Config шалгана уу)'
                                                    : 'Зөвхөн энэ төхөөрөмж дээр хадгалж байна (Firebase Config оруулаагүй)'
                                            }
                                            className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${
                                                syncStatus === 'connected'
                                                    ? 'bg-emerald-50 text-emerald-700 border-emerald-200'
                                                    : syncStatus === 'connecting'
                                                    ? 'bg-amber-50 text-amber-700 border-amber-200'
                                                    : syncStatus === 'error'
                                                    ? 'bg-rose-50 text-rose-700 border-rose-200'
                                                    : 'bg-slate-100 text-slate-500 border-slate-200'
                                            }`}
                                        >
                                            {syncStatus === 'connected'
                                                ? '🟢 Cloud Sync'
                                                : syncStatus === 'connecting'
                                                ? '🟡 Холбож байна...'
                                                : syncStatus === 'error'
                                                ? '🔴 Алдаа'
                                                : '⚪ Local'}
                                        </span>
                                    </div>
                                    <p className="text-[11px] text-slate-500 font-medium">Интерактив хичээл ба үнэлгээний систем</p>
                                </div>
                            </div>

                            {/* Primary Mode Switcher */}
                            <div className="flex bg-slate-100 p-1 rounded-2xl border border-slate-200">
                                <button
                                    onClick={() => setMainMode('student')}
                                    className={`px-3 sm:px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 ${
                                        mainMode === 'student'
                                            ? 'bg-white text-indigo-600 shadow-sm'
                                            : 'text-slate-600 hover:text-slate-900'
                                    }`}
                                >
                                    <span>🏫</span> Сурагч & Анги
                                </button>
                                <button
                                    onClick={() => setMainMode('teacher')}
                                    className={`px-3 sm:px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 ${
                                        mainMode === 'teacher'
                                            ? 'bg-indigo-600 text-white shadow-sm'
                                            : 'text-slate-600 hover:text-slate-900'
                                    }`}
                                >
                                    <span>👩‍🏫</span> Багшийн Админ
                                </button>
                            </div>

                            {/* Student Profile Login/Switcher + XP + Sound */}
                            <div className="flex flex-wrap items-center gap-2">
                                <div className="flex items-center bg-indigo-50/80 border border-indigo-200 rounded-2xl p-1">
                                    <span className="pl-2 text-sm">👤</span>
                                    <select
                                        value={activeStudent.id}
                                        onChange={(e) => {
                                            setActiveStudentId(e.target.value);
                                            const st = students.find(x => x.id === e.target.value);
                                            if (st) showToast(`${st.name} (${st.className}) сонгогдлоо`, 'info');
                                        }}
                                        className="bg-transparent text-xs font-extrabold text-indigo-900 px-2 py-1.5 outline-none max-w-[145px] sm:max-w-[190px]"
                                    >
                                        {students.map(st => (
                                            <option key={st.id} value={st.id}>
                                                {st.name} ({st.className})
                                            </option>
                                        ))}
                                    </select>
                                    <button
                                        onClick={() => setShowQuickStudentModal(true)}
                                        className="px-2.5 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-[11px] font-bold rounded-xl transition-colors"
                                        title="Шинээр нэрээ бүртгүүлж нэвтрэх"
                                    >
                                        + Нэмэх
                                    </button>
                                </div>

                                <div className="bg-amber-50 border border-amber-200 px-3 py-1.5 rounded-2xl flex items-center gap-2">
                                    <span className="text-base">⭐</span>
                                    <div className="leading-tight">
                                        <div className="text-[10px] font-bold text-amber-700 uppercase">Түвшин {activeStudent.level}</div>
                                        <div className="text-xs font-extrabold text-amber-600">{activeStudent.xp} XP</div>
                                    </div>
                                </div>

                                <button
                                    onClick={toggleMute}
                                    title={isMuted ? "Дуу нээх" : "Дуу хаах"}
                                    className="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-base transition-colors"
                                >
                                    {isMuted ? '🔇' : '🔊'}
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* MAIN BODY */}
                    <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
                        {mainMode === 'student' ? (
                            <div className="space-y-6">
                                {/* 10 INTERACTIVE MODULES NAVIGATION GRID */}
                                <div className="bg-white/80 backdrop-blur-sm p-3 rounded-3xl border border-slate-200/80 shadow-sm no-print">
                                    <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2">
                                        {MODULES.map(mod => {
                                            const active = activeModule === mod.id;
                                            return (
                                                <button
                                                    key={mod.id}
                                                    onClick={() => {
                                                        SoundFX.flip();
                                                        setActiveModule(mod.id);
                                                    }}
                                                    className={`p-2.5 rounded-2xl text-left transition-all flex items-center gap-2.5 border ${
                                                        active
                                                            ? `bg-gradient-to-br ${mod.color} text-white border-transparent shadow-md scale-[1.01]`
                                                            : 'bg-white hover:bg-indigo-50/60 text-slate-700 border-slate-100 hover:border-indigo-200'
                                                    }`}
                                                >
                                                    <span className="text-xl shrink-0">{mod.icon}</span>
                                                    <span className="text-xs font-bold leading-snug line-clamp-2">{mod.label}</span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>

                                {/* OPTIONAL TOPIC FILTER FOR CURRICULUM MODULES */}
                                {['quiz', 'flashcards', 'simulation', 'factcheck'].includes(activeModule) && (
                                    <div className="flex flex-wrap items-center gap-2 bg-white px-4 py-3 rounded-2xl border border-slate-200/80 shadow-sm no-print">
                                        <span className="text-xs font-bold text-slate-500 mr-1">📚 Сэдэв шүүх:</span>
                                        <button
                                            onClick={() => setSelectedTopic('all')}
                                            className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${
                                                selectedTopic === 'all'
                                                    ? 'bg-indigo-600 text-white shadow-sm'
                                                    : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                                            }`}
                                        >
                                            🌈 Бүх сэдэв
                                        </button>
                                        {data.topics.map(t => (
                                            <button
                                                key={t.id}
                                                onClick={() => setSelectedTopic(t.id)}
                                                className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 ${
                                                    selectedTopic === t.id
                                                        ? 'bg-indigo-600 text-white shadow-sm'
                                                        : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                                                }`}
                                            >
                                                <span>{t.icon}</span>
                                                <span>{t.title}</span>
                                            </button>
                                        ))}
                                    </div>
                                )}

                                {/* RENDER ACTIVE MODULE */}
                                <div className="animate-pop">
                                    {activeModule === 'quiz' && (
                                        <QuizModule
                                            quizzes={selectedTopic === 'all' ? data.quizzes : data.quizzes.filter(q => q.topicId === selectedTopic)}
                                            topics={data.topics}
                                            activeStudent={activeStudent}
                                            updateActiveStudent={updateActiveStudent}
                                            awardXP={awardXP}
                                        />
                                    )}
                                    {activeModule === 'flashcards' && (
                                        <FlashcardsModule
                                            flashcards={selectedTopic === 'all' ? data.flashcards : data.flashcards.filter(f => f.topicId === selectedTopic)}
                                            masteredCards={activeStudent.masteredCards || []}
                                            onMaster={(cardId) => {
                                                if (!(activeStudent.masteredCards || []).includes(cardId)) {
                                                    const nextLen = (activeStudent.masteredCards || []).length + 1;
                                                    updateActiveStudent(prev => ({
                                                        ...prev,
                                                        masteredCards: [...(prev.masteredCards || []), cardId]
                                                    }));
                                                    awardXP(15, nextLen >= 3 ? 'b2' : null);
                                                    SoundFX.correct();
                                                    showToast('Картыг эзэмшсэнээр бүртгэлээ! +15 XP');
                                                }
                                            }}
                                        />
                                    )}
                                    {activeModule === 'simulation' && (
                                        <SimulationModule
                                            simulations={selectedTopic === 'all' ? data.simulations : data.simulations.filter(s => s.topicId === selectedTopic)}
                                            activeStudent={activeStudent}
                                            updateActiveStudent={updateActiveStudent}
                                            awardXP={awardXP}
                                        />
                                    )}
                                    {activeModule === 'factcheck' && (
                                        <FactCheckModule

        // ==========================================
        // MODULE 1: QUIZ (СЭРГЭЛЭН СОРИЛ)
        // ==========================================
        function QuizModule({ quizzes, topics, activeStudent, updateActiveStudent, awardXP }) {
            const [started, setStarted] = useState(false);
            const [idx, setIdx] = useState(0);
            const [selected, setSelected] = useState(null);
            const [submitted, setSubmitted] = useState(false);
            const [score, setScore] = useState(0);
            const [correctCount, setCorrectCount] = useState(0);
            const [streak, setStreak] = useState(0);
            const [showHint, setShowHint] = useState(false);
            const [finished, setFinished] = useState(false);

            useEffect(() => {
                setStarted(false);
                setFinished(false);
            }, [quizzes.length]);

            const startQuiz = () => {
                setStarted(true);
                setIdx(0);
                setSelected(null);
                setSubmitted(false);
                setScore(0);
                setCorrectCount(0);
                setStreak(0);
                setShowHint(false);
                setFinished(false);
            };

            const handleSubmit = () => {
                if (selected === null || submitted) return;
                setSubmitted(true);
                const q = quizzes[idx];
                if (selected === q.correctAnswer) {
                    SoundFX.correct();
                    const bonus = streak * 5;
                    const pts = 20 + bonus;
                    setScore(s => s + pts);
                    setCorrectCount(c => c + 1);
                    setStreak(st => st + 1);
                    awardXP(pts);
                } else {
                    SoundFX.wrong();
                    setStreak(0);
                }
            };

            const handleNext = () => {
                if (idx + 1 < quizzes.length) {
                    setIdx(i => i + 1);
                    setSelected(null);
                    setSubmitted(false);
                    setShowHint(false);
                } else {
                    setFinished(true);
                    updateActiveStudent(prev => ({
                        ...prev,
                        quizHistory: [
                            ...(prev.quizHistory || []),
                            { date: new Date().toISOString().slice(0, 10), score: correctCount, total: quizzes.length }
                        ]
                    }));
                    if (window.confetti) window.confetti({ particleCount: 110, spread: 75, origin: { y: 0.6 } });
                }
            };

            if (quizzes.length === 0) {
                return (
                    <div className="bg-white rounded-3xl p-10 text-center border border-slate-200 max-w-xl mx-auto">
                        <div className="text-4xl mb-3">📭</div>
                        <h3 className="font-bold text-lg text-slate-800">Энэ сэдэвт одоогоор асуулт алга байна</h3>
                        <p className="text-xs text-slate-500 mt-1">Багшийн админ хэсгээс шинэ асуулт нэмэх боломжтой.</p>
                    </div>
                );
            }

            if (!started) {
                return (
                    <div className="bg-white rounded-3xl p-8 border border-slate-200/80 shadow-lg max-w-2xl mx-auto text-center">
                        <div className="w-20 h-20 rounded-3xl bg-indigo-100 text-indigo-600 flex items-center justify-center text-4xl mx-auto mb-4">
                            🎯
                        </div>
                        <h2 className="font-heading text-2xl font-extrabold text-slate-800 mb-2">Сэргэлэн Сорил (Quiz)</h2>
                        <p className="text-xs font-bold text-indigo-600 mb-2">Оролцогч: {activeStudent.name} ({activeStudent.className})</p>
                        <p className="text-sm text-slate-600 mb-6">
                            Сонгосон сэдвийн хүрээнд мэдлэгээ сорьж, дараалсан зөв хариултаар нэмэлт бонус XP цуглуулаарай!
                        </p>
                        <div className="flex flex-wrap justify-center gap-3 text-xs font-bold text-slate-600 mb-6">
                            <span className="bg-slate-100 px-3.5 py-2 rounded-xl">❓ Нийт {quizzes.length} асуулт</span>
                            <span className="bg-amber-50 text-amber-700 px-3.5 py-2 rounded-xl">🔥 Дараалсан бонус +5 XP</span>
                            <span className="bg-emerald-50 text-emerald-700 px-3.5 py-2 rounded-xl">📘 Тайлбар ба Зөвлөмжтэй</span>
                        </div>
                        <button
                            onClick={startQuiz}
                            className="px-8 py-3.5 bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 text-white font-bold rounded-2xl shadow-lg shadow-indigo-200 transition-all text-sm"
                        >
                            Сорилыг эхлүүлэх 🚀
                        </button>
                    </div>
                );
            }

            if (finished) {
                const percent = Math.round((correctCount / quizzes.length) * 100);
                return (
                    <div className="bg-white rounded-3xl p-8 border border-slate-200 shadow-xl max-w-lg mx-auto text-center">
                        <div className="text-6xl mb-3">{percent >= 80 ? '🏆' : percent >= 50 ? '👏' : '💪'}</div>
                        <h3 className="font-heading text-2xl font-extrabold text-slate-800 mb-1">Сорил Дууслаа!</h3>
                        <p className="text-xs text-slate-500 mb-6">
                            <strong>{activeStudent.name}</strong> та {quizzes.length} асуултаас {correctCount}-д нь зөв хариуллаа ({percent}%).
                        </p>
                        <div className="grid grid-cols-2 gap-3 mb-6">
                            <div className="bg-indigo-50 border border-indigo-100 p-4 rounded-2xl">
                                <div className="text-2xl font-extrabold text-indigo-600">+{score} XP</div>
                                <div className="text-xs font-semibold text-indigo-800">Авсан оноо</div>
                            </div>
                            <div className="bg-emerald-50 border border-emerald-100 p-4 rounded-2xl">
                                <div className="text-2xl font-extrabold text-emerald-600">{percent}%</div>
                                <div className="text-xs font-semibold text-emerald-800">Гүйцэтгэл</div>
                            </div>
                        </div>
                        <button
                            onClick={startQuiz}
                            className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl text-sm transition-all"
                        >
                            Дахин оролдох ↺
                        </button>
                    </div>
                );
            }

            const q = quizzes[idx];
            const topicObj = topics.find(t => t.id === q.topicId);

            return (
                <div className="max-w-2xl mx-auto bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-lg">
                    <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
                        <div className="flex items-center gap-2">
                            <span className="text-xs font-bold bg-indigo-50 text-indigo-600 px-3 py-1 rounded-full">
                                Асуулт {idx + 1} / {quizzes.length}
                            </span>
                            {topicObj && (
                                <span className="text-xs font-semibold bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full">
                                    {topicObj.icon} {topicObj.title}
                                </span>
                            )}
                        </div>
                        {streak > 1 && (
                            <span className="text-xs font-extrabold bg-amber-100 text-amber-700 px-3 py-1 rounded-full">
                                🔥 {streak} дараалсан! (+{streak * 5} XP)
                            </span>
                        )}
                    </div>

                    <div className="w-full bg-slate-100 h-2 rounded-full mb-6 overflow-hidden">
                        <div
                            className="bg-indigo-600 h-full transition-all duration-300"
                            style={{ width: `${((idx + 1) / quizzes.length) * 100}%` }}
                        ></div>
                    </div>

                    <h3 className="text-lg sm:text-xl font-bold text-slate-800 mb-5 leading-snug">{q.question}</h3>

                    {q.hint && !submitted && (
                        <div className="mb-4">
                            {!showHint ? (
                                <button
                                    onClick={() => setShowHint(true)}
                                    className="text-xs font-bold text-amber-600 hover:text-amber-700 flex items-center gap-1"
                                >
                                    💡 Зөвлөмж харах
                                </button>
                            ) : (
                                <div className="bg-amber-50 border border-amber-200 text-amber-900 text-xs p-3 rounded-xl">
                                    <strong>Зөвлөмж:</strong> {q.hint}
                                </div>
                            )}
                        </div>
                    )}

                    <div className="space-y-3 mb-6">
                        {q.options.map((opt, i) => {
                            let cls = "bg-slate-50 border-slate-200 text-slate-700 hover:bg-indigo-50/70 hover:border-indigo-300";
                            if (selected === i) cls = "bg-indigo-50 border-indigo-600 text-indigo-800 ring-2 ring-indigo-200 font-bold";
                            if (submitted) {
                                if (i === q.correctAnswer) cls = "bg-emerald-50 border-emerald-500 text-emerald-900 font-bold ring-2 ring-emerald-200";
                                else if (selected === i) cls = "bg-rose-50 border-rose-500 text-rose-900 font-bold animate-shake";
                                else cls = "bg-slate-50 border-slate-200 text-slate-400 opacity-60";
                            }
                            return (
                                <button
                                    key={i}
                                    onClick={() => !submitted && setSelected(i)}
                                    className={`w-full p-4 rounded-2xl border text-left text-sm transition-all flex items-center justify-between gap-3 ${cls}`}
                                >
                                    <span className="flex items-center gap-3">
                                        <span className="w-7 h-7 rounded-lg bg-white border border-slate-200 flex items-center justify-center text-xs font-extrabold shrink-0">
                                            {['А', 'Б', 'В', 'Г'][i] || i + 1}
                                        </span>
                                        <span>{opt}</span>
                                    </span>
                                    {submitted && i === q.correctAnswer && <span className="text-emerald-600 font-extrabold text-base">✓</span>}
                                    {submitted && selected === i && i !== q.correctAnswer && <span className="text-rose-600 font-extrabold text-base">✕</span>}
                                </button>
                            );
                        })}
                    </div>

                    {submitted && q.explanation && (
                        <div className="bg-blue-50 border border-blue-200 rounded-2xl p-4 mb-6 text-xs text-blue-900 leading-relaxed">
                            <strong className="block font-bold text-blue-950 mb-1">📘 Хууль зүй ба Онолын тайлбар:</strong>
                            {q.explanation}
                        </div>
                    )}

                    <div className="flex justify-end">
                        {!submitted ? (
                            <button
                                onClick={handleSubmit}
                                disabled={selected === null}
                                className={`px-6 py-3 rounded-xl font-bold text-sm transition-all ${
                                    selected !== null
                                        ? 'bg-indigo-600 hover:bg-indigo-700 text-white shadow-md'
                                        : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                                }`}
                            >
                                Хариулт шалгах ✓
                            </button>
                        ) : (
                            <button
                                onClick={handleNext}
                                className="px-6 py-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-bold rounded-xl shadow-md text-sm"
                            >
                                {idx + 1 < quizzes.length ? 'Дараагийн асуулт ➔' : 'Үр дүн харах 🏆'}
                            </button>
                        )}
                    </div>
                </div>
            );
        }

        // ==========================================

            const [index, setIndex] = useState(0);

                setIndex(0);
                setFlipped(false);
            }, [flashcards.length]);

                return (
                    <div className="bg-white rounded-3xl p-10 text-center border border-slate-200 max-w-xl mx-auto">
                        <div className="text-4xl mb-3">🃏</div>
                        <h3 className="font-bold text-lg text-slate-800">Энэ сэдэвт карт ороогүй байна</h3>
                    </div>
                );
            }

            const isMastered = masteredCards.includes(card.id);
            const masteredInSet = flashcards.filter(f => masteredCards.includes(f.id)).length;

                        </span>

                                <div className="w-full flex justify-between items-center text-xs font-bold text-indigo-200">

                                    <span className="text-[11px] font-extrabold uppercase tracking-wider text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-lg">

        // ==========================================
        // MODULE 3: DECISION SIMULATION
        // ==========================================
        function SimulationModule({ simulations, activeStudent, updateActiveStudent, awardXP }) {
            const [activeSim, setActiveSim] = useState(null);
            const [stepIdx, setStepIdx] = useState(0);
            const [meters, setMeters] = useState({ budget: 70, trust: 50, law: 60 });
            const [chosenConsequence, setChosenConsequence] = useState(null);
            const [completed, setCompleted] = useState(false);

            const startSim = (sim) => {
                setActiveSim(sim);
                setStepIdx(0);
                setMeters(sim.initialMeters || { budget: 70, trust: 50, law: 60 });
                setChosenConsequence(null);
                setCompleted(false);
            };

            const clamp = (val) => Math.max(0, Math.min(100, val));

            const pickChoice = (choice) => {
                if (chosenConsequence) return;
                const nextMeters = {
                    budget: clamp(meters.budget + (choice.delta.budget || 0)),
                    trust: clamp(meters.trust + (choice.delta.trust || 0)),
                    law: clamp(meters.law + (choice.delta.law || 0))
                };
                setMeters(nextMeters);
                setChosenConsequence(choice);
                const netScore = (choice.delta.trust || 0) + (choice.delta.law || 0);
                if (netScore >= 0) SoundFX.correct();
                else SoundFX.wrong();
            };

            const nextStep = () => {
                if (stepIdx + 1 < activeSim.steps.length) {
                    setStepIdx(s => s + 1);
                    setChosenConsequence(null);
                } else {
                    setCompleted(true);
                    if (!(activeStudent.completedSims || []).includes(activeSim.id)) {

        // ==========================================
        // MODULE 4: FACT-CHECKER (БАРИМТ ШАЛГАГЧ)
        // ==========================================
        function FactCheckModule({ factChecks, awardXP }) {
            const [votes, setVotes] = useState({});

            const handleVote = (item, userSaysTrue) => {
                if (votes[item.id] !== undefined) return;
                setVotes(prev => ({ ...prev, [item.id]: userSaysTrue }));
                if (userSaysTrue === item.isTrue) {
                    SoundFX.correct();
                    awardXP(25, 'b3');
                } else {
                    SoundFX.wrong();
                }
            };

            return (
                <div className="max-w-3xl mx-auto space-y-5">
                    <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm flex flex-wrap items-center justify-between gap-3">
                        <div>
                            <h2 className="font-heading text-xl font-extrabold text-slate-800">🔍 Баримт Шалгагч (Үнэн үү, Худал уу?)</h2>
                            <p className="text-xs text-slate-500 mt-0.5">Сошиал орчинд түгсэн мэдээллийг хууль, эдийн засгийн мэдлэгээрээ шүүн тунгаагаарай.</p>
                        </div>
                        <span className="text-xs font-bold bg-rose-50 text-rose-600 px-3 py-1.5 rounded-xl border border-rose-200">
                            Зөв таавал +25 XP
                        </span>
                    </div>

                    {factChecks.map(item => {
                        const userVote = votes[item.id];
                        const isAnswered = userVote !== undefined;
                        const isCorrect = isAnswered && userVote === item.isTrue;

                        return (
                            <div key={item.id} className="bg-white rounded-3xl p-6 border border-slate-200 shadow-md">
                                <div className="flex items-center justify-between mb-3">
                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-slate-700 to-slate-900 text-white flex items-center justify-center font-bold text-sm">
                                            {item.author.slice(0, 2)}
                                        </div>
                                        <div>
                                            <div className="font-bold text-sm text-slate-800 flex items-center gap-1.5">
                                                <span>{item.author}</span>
                                                <span className="text-[11px] font-normal text-slate-400">{item.handle} • {item.time}</span>
                                            </div>
                                            <div className="text-[11px] text-slate-400">🔄 {item.shares}</div>
                                        </div>
                                    </div>
                                    <span className="text-[11px] font-bold bg-slate-100 text-slate-500 px-2.5 py-1 rounded-lg">
                                        Нийгмийн пост
                                    </span>
                                </div>

                                <p className="text-sm sm:text-base font-semibold text-slate-800 bg-slate-50 p-4 rounded-2xl border border-slate-100 mb-4 leading-relaxed">
                                    “{item.claim}”
                                </p>

                                {!isAnswered ? (
                                    <div className="grid grid-cols-2 gap-3">
                                        <button
                                            onClick={() => handleVote(item, true)}
                                            className="py-3 bg-emerald-50 hover:bg-emerald-600 text-emerald-700 hover:text-white border border-emerald-200 font-extrabold rounded-2xl text-sm transition-all"
                                        >
                                            ✅ ҮНЭН МЭДЭЭЛЭЛ
                                        </button>
                                        <button
                                            onClick={() => handleVote(item, false)}
                                            className="py-3 bg-rose-50 hover:bg-rose-600 text-rose-700 hover:text-white border border-rose-200 font-extrabold rounded-2xl text-sm transition-all"
                                        >
                                            ❌ ХУДАЛ / ТАШАА
                                        </button>
                                    </div>
                                ) : (
                                    <div className={`rounded-2xl p-4 border animate-pop ${
                                        isCorrect ? 'bg-emerald-50 border-emerald-300' : 'bg-rose-50 border-rose-300'
                                    }`}>
                                        <div className="flex items-center justify-between mb-1.5">
                                            <span className={`font-extrabold text-sm ${isCorrect ? 'text-emerald-800' : 'text-rose-800'}`}>
                                                {isCorrect ? '🎉 Зөв таалаа! (+25 XP)' : '⚠️ Андуурлаа!'}
                                            </span>
                                            <span className={`text-xs font-extrabold px-2.5 py-0.5 rounded-full ${
                                                item.isTrue ? 'bg-emerald-600 text-white' : 'bg-rose-600 text-white'
                                            }`}>
                                                Бодит байдал: {item.isTrue ? 'ҮНЭН' : 'ХУДАЛ'}
                                            </span>
                                        </div>
                                        <p className="text-xs sm:text-sm text-slate-800 leading-relaxed">
                                            {item.explanation}
                                        </p>
                                    </div>
                                )}
                            </div>
                        );
                    })}
                </div>
            );
        }

        // ==========================================
        // MODULE 5: MATCHING GAME (ОЙЛГОЛТ ЭВЛҮҮЛЭХ)
        // ==========================================
        function MatchingGameModule({ flashcards, bestTime, onWin }) {
            const [roundCards, setRoundCards] = useState([]);
            const [shuffledDefs, setShuffledDefs] = useState([]);
            const [selectedTermId, setSelectedTermId] = useState(null);
            const [matchedIds, setMatchedIds] = useState([]);
            const [wrongPair, setWrongPair] = useState(null);
            const [seconds, setSeconds] = useState(0);
            const [isWon, setIsWon] = useState(false);

            const initRound = () => {
                const pool = [...flashcards].sort(() => Math.random() - 0.5).slice(0, 6);
                setRoundCards(pool);
                setShuffledDefs([...pool].sort(() => Math.random() - 0.5));
                setSelectedTermId(null);
                setMatchedIds([]);
                setWrongPair(null);
                setSeconds(0);
                setIsWon(false);
            };

            useEffect(() => {
                initRound();
            }, [flashcards]);

            useEffect(() => {
                if (isWon || roundCards.length === 0) return;
                const timer = setInterval(() => setSeconds(s => s + 1), 1000);
                return () => clearInterval(timer);
            }, [isWon, roundCards.length]);

            const handleDefClick = (defCard) => {
                if (!selectedTermId || matchedIds.includes(defCard.id)) return;
                if (selectedTermId === defCard.id) {
                    SoundFX.correct();
                    const updated = [...matchedIds, defCard.id];
                    setMatchedIds(updated);
                    setSelectedTermId(null);
                    if (updated.length === roundCards.length) {
                        setIsWon(true);
                        onWin(seconds);
                        if (window.confetti) window.confetti({ particleCount: 100, spread: 70 });
                    }
                } else {
                    SoundFX.wrong();
                    setWrongPair({ term: selectedTermId, def: defCard.id });
                    setTimeout(() => setWrongPair(null), 500);
                }
            };

            const formatTime = (sec) => {
                const m = Math.floor(sec / 60).toString().padStart(2, '0');
                const s = (sec % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            };

            return (
                <div className="max-w-4xl mx-auto bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-lg">
                    <div className="flex flex-wrap items-center justify-between gap-3 mb-6">
                        <div>
                            <h2 className="font-heading text-xl font-extrabold text-slate-800">🧩 Ойлголт Эвлүүлэх Хурдны Сорил</h2>
                            <p className="text-xs text-slate-500">Зүүн талын ойлголт дээр дараад баруун талын тохирох бодит жишээ/тодорхойлолттой холбоно уу.</p>
                        </div>
                        <div className="flex items-center gap-3">
                            <div className="bg-amber-50 border border-amber-200 px-3.5 py-2 rounded-xl text-xs font-extrabold text-amber-800">
                                ⏱️ Хугацаа: {formatTime(seconds)}
                            </div>
                            {bestTime !== null && bestTime !== undefined && (
                                <div className="bg-emerald-50 border border-emerald-200 px-3.5 py-2 rounded-xl text-xs font-extrabold text-emerald-700">
                                    🏆 Дээд амжилт: {formatTime(bestTime)}
                                </div>
                            )}
                            <button
                                onClick={initRound}
                                className="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-xs font-bold text-slate-700"
                            >
                                Шинэ багц ↺
                            </button>
                        </div>
                    </div>

                    {isWon ? (
                        <div className="text-center py-10 space-y-4">
                            <div className="text-6xl">🎉</div>
                            <h3 className="font-heading text-2xl font-extrabold text-slate-800">
                                Бүгдийг {formatTime(seconds)} секундэд зөв эвлүүллээ!
                            </h3>
                            <p className="text-sm text-slate-600">+40 XP оноо таны дансанд нэмэгдлээ.</p>
                            <button
                                onClick={initRound}
                                className="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl text-sm shadow-md"
                            >
                                Дахин тоглох 🚀
                            </button>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div className="space-y-2.5">
                                <div className="text-xs font-bold uppercase text-indigo-600 px-1">1. Ойлголт / Нэр томьёо</div>
                                {roundCards.map(item => {
                                    const matched = matchedIds.includes(item.id);
                                    const selected = selectedTermId === item.id;
                                    const isWrong = wrongPair?.term === item.id;
                                    return (
                                        <button
                                            key={item.id}
                                            disabled={matched}
                                            onClick={() => setSelectedTermId(item.id)}
                                            className={`w-full p-4 rounded-2xl border text-left font-bold text-sm transition-all ${
                                                matched
                                                    ? 'bg-emerald-50 border-emerald-300 text-emerald-700 opacity-60'
                                                    : isWrong
                                                    ? 'bg-rose-50 border-rose-500 text-rose-700 animate-shake'
                                                    : selected
                                                    ? 'bg-indigo-600 border-indigo-600 text-white shadow-md scale-[1.01]'
                                                    : 'bg-slate-50 border-slate-200 hover:border-indigo-300 text-slate-800'
                                            }`}
                                        >
                                            {matched ? `✓ ${item.term}` : item.term}
                                        </button>
                                    );
                                })}
                            </div>

                            <div className="space-y-2.5">
                                <div className="text-xs font-bold uppercase text-purple-600 px-1">2. Бодит жишээ ба Утга</div>
                                {shuffledDefs.map(item => {
                                    const matched = matchedIds.includes(item.id);
                                    const isWrong = wrongPair?.def === item.id;
                                    return (
                                        <button
                                            key={item.id}
                                            disabled={matched}
                                            onClick={() => handleDefClick(item)}
                                            className={`w-full p-3.5 rounded-2xl border text-left text-xs leading-relaxed transition-all ${
                                                matched
                                                    ? 'bg-emerald-50 border-emerald-300 text-emerald-800 opacity-60'
                                                    : isWrong
                                                    ? 'bg-rose-50 border-rose-500 text-rose-800 animate-shake'
                                                    : selectedTermId
                                                    ? 'bg-white border-purple-300 hover:bg-purple-50 text-slate-700 cursor-pointer shadow-sm'
                                                    : 'bg-slate-50 border-slate-200 text-slate-600'
                                            }`}
                                        >
                                            {item.example ? `📌 ${item.example}` : item.definition}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    )}
                </div>
            );
        }
